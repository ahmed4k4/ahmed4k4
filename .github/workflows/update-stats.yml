name: Refresh profile statistics

on:
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/generate_stats.py'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate live profile metrics
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/generate_stats.py
      - name: Commit updated SVG metrics
        run: |
          if [[ -n "$(git status --porcelain assets/github.svg assets/sm/github.svg assets/github-stats.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/github.svg assets/sm/github.svg assets/github-stats.json
            git commit -m "chore: refresh GitHub profile metrics"
            git push
          fi
