<svg xmlns="http://www.w3.org/2000/svg" width="600" height="520" viewBox="0 0 600 520" role="img" aria-label="NetworkMonitor — Network Control and Traffic Intelligence Center">
<title>NetworkMonitor — Network Control &amp; Traffic Intelligence Center</title><desc>Development-stage network monitoring platform with packet/flow processing, device discovery, APIs and live dashboard.</desc>
<defs><linearGradient id="bgm" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0a1428"/><stop offset="1" stop-color="#101b32"/></linearGradient><linearGradient id="edgem" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#22d3ee"/><stop offset=".55" stop-color="#60a5fa"/><stop offset="1" stop-color="#a78bfa"/></linearGradient><linearGradient id="pm" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#142744"/><stop offset="1" stop-color="#0b172b"/></linearGradient><radialGradient id="gm"><stop stop-color="#22d3ee" stop-opacity=".2"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient></defs>
<style>.tx{font-family:Arial,sans-serif;fill:#e6f1ff}.mu{font-family:Arial,sans-serif;fill:#8fa7c5}.sm{font-family:Arial,sans-serif;font-size:12px;fill:#8fa7c5}.lab{font-family:Arial,sans-serif;font-size:11px;letter-spacing:1.2px;fill:#7dd3fc}.pulse{animation:pulse 2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.trace{stroke-dasharray:7 12;animation:trace 8s linear infinite}.bar{transform-box:fill-box;transform-origin:50% 100%;animation:grow 3s ease-in-out infinite alternate}.bar:nth-of-type(2n){animation-delay:-1s}@keyframes pulse{0%,100%{opacity:.45;transform:scale(.88)}50%{opacity:1;transform:scale(1.16)}}@keyframes trace{to{stroke-dashoffset:-160}}@keyframes grow{0%{transform:scaleY(.45)}100%{transform:scaleY(1)}}@media(prefers-reduced-motion:reduce){.pulse,.trace,.bar{animation:none!important}}</style>
<rect width="600" height="520" rx="22" fill="url(#bgm)"/><circle cx="80" cy="0" r="250" fill="url(#gm)"/><g opacity=".12" stroke="#5c7da6"><path d="M0 60H600M0 120H600M0 180H600M0 240H600M0 300H600M0 360H600M0 420H600M0 480H600"/><path d="M60 0V520M120 0V520M180 0V520M240 0V520M300 0V520M360 0V520M420 0V520M480 0V520M540 0V520"/></g>
