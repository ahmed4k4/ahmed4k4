<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="490" viewBox="0 0 1200 490" role="img" aria-labelledby="title desc">
<title id="title">Ahmed4k4 — Web Engineering, Embedded Systems and IoT</title><desc id="desc">Ahmed Adel Fekry Abdelkader building full-stack web platforms, embedded firmware, IoT devices and robotics prototypes.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#061421"/><stop offset=".58" stop-color="#0a1b2e"/><stop offset="1" stop-color="#11152b"/></linearGradient>
 <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#34d8f4"/><stop offset="1" stop-color="#6aa8ff"/></linearGradient>
 <linearGradient id="amber" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#ffc36b"/><stop offset="1" stop-color="#ff8b4d"/></linearGradient>
 <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#9b8cff"/><stop offset="1" stop-color="#45cfff"/></linearGradient>
 <radialGradient id="halo"><stop stop-color="#1c99c7" stop-opacity=".26"/><stop offset="1" stop-color="#1c99c7" stop-opacity="0"/></radialGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="10" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#4ea3c9" stroke-opacity=".10" stroke-width="1"/></pattern>
 <style>
 @keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
 @keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
 @keyframes sweep{0%{transform:translateX(-140%)}100%{transform:translateX(520%)}}
 @keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(9px,-8px)}}
 @keyframes trace{to{stroke-dashoffset:-80}}
 @keyframes blink{50%{opacity:0}}
 .rise{animation:rise .8s cubic-bezier(.2,.8,.2,1) both}.d1{animation-delay:.12s}.d2{animation-delay:.24s}.d3{animation-delay:.36s}.d4{animation-delay:.48s}
 .float{animation:drift 7s ease-in-out infinite}.pulse{animation:pulse 2.4s ease-in-out infinite}.flow{stroke-dasharray:8 10;animation:trace 6s linear infinite}.scan{animation:sweep 6.5s ease-in-out infinite}
 @media(prefers-reduced-motion:reduce){.rise,.float,.pulse,.flow,.scan{animation:none!important}}
 </style>
</defs>
